[package]
name = "flectar-mail-sync-proto"
description = "Wire types of the Flectar Mail Sync protocol"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/flectar/mail-sync-client"

# Inlined from the repository's workspace.dependencies: this crate is
# consumed as a path dependency from another workspace.

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
