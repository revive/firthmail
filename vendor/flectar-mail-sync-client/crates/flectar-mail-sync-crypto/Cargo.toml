[package]
name = "flectar-mail-sync-crypto"
description = "Key schedule, record sealing and signed membership operations of Flectar Mail Sync"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/flectar/mail-sync-client"

# Inlined from the repository's workspace.dependencies: this crate is
# consumed as a path dependency from another workspace.

[dependencies]
bip39 = { version = "3.0", default-features = false, features = ["std"] }
chacha20poly1305 = "0.11"
ed25519-dalek = "3.0"
getrandom = "0.4"
hkdf = "0.13"
hpke = { version = "0.15.1", default-features = false, optional = true, features = [
    "alloc",
    "getrandom",
    "mlkem",
    "x25519",
    "chacha",
    "hkdfsha2",
] }
hmac = "0.13"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

[features]
# Key wrapping to devices (HPKE with the X-Wing hybrid KEM). Devices need it;
# the server never wraps or unwraps keys.
kem = ["dep:hpke"]

[dev-dependencies]
hex = "0.4"
